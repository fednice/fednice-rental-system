<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12251e">
  <title>FEDNICE | Rental Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17251e;
      background: #f4f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .topbar { background: #12251e; color: #fff; }
    .topbar-inner, main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .topbar-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { margin: 0; font-size: 1.25rem; letter-spacing: .14em; font-weight: 800; }
    .brand span { color: #b2d69a; }
    .topbar-label { color: #c4d1c8; font-size: .9rem; }
    main { padding: 42px 0 56px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { margin: 0 0 8px; color: #67806f; text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; font-weight: 750; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.2rem); letter-spacing: -.04em; }
    .intro-note { margin: 8px 0 0; color: #68746d; }
    .live-badge { flex: 0 0 auto; padding: 8px 12px; border: 1px solid #d9e5d5; border-radius: 999px; color: #426a43; background: #edf5e9; font-size: .8rem; font-weight: 700; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 36px; }
    .summary-card { padding: 19px 20px; border: 1px solid #e5e9e2; border-radius: 12px; background: #fff; }
    .summary-label { display: block; color: #718077; font-size: .82rem; }
    .summary-value { display: block; margin-top: 9px; font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 750; letter-spacing: -.04em; }
    .summary-card.rent { color: #fff; border-color: #244c39; background: #244c39; }
    .summary-card.rent .summary-label { color: #c9ddcd; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    h2 { margin: 0; font-size: 1.15rem; }
    .section-count { color: #79857d; font-size: .82rem; }
    .house-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 30px; }
    .house-card { padding: 15px; border: 1px solid #e5e9e2; border-radius: 11px; background: #fff; }
    .house-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .house-number { font-size: 1rem; font-weight: 750; }
    .status { padding: 5px 8px; border-radius: 999px; background: #f1f2ee; color: #667168; font-size: .68rem; font-weight: 750; }
    .status.occupied { background: #e8f3e8; color: #3d7046; }
    .tenant { min-height: 18px; margin: 12px 0 7px; color: #768078; font-size: .78rem; }
    .house-rent { font-size: 1.05rem; font-weight: 720; }
    .rent-caption { margin-left: 3px; color: #8a948c; font-size: .72rem; font-weight: 450; }
    .error { padding: 14px 16px; border: 1px solid #e9c4be; border-radius: 10px; color: #7b3025; background: #fff3f0; }
    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .house-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .topbar-inner, main { width: min(100% - 28px, 1120px); }
      .topbar-inner { min-height: 66px; }
      main { padding-top: 30px; }
      .intro { align-items: start; flex-direction: column; }
      .house-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .house-card { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand">FED<span>NICE</span></p>
      <span class="topbar-label">Property management</span>
    </div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Overview</p>
        <h1 id="page-title">Rental dashboard</h1>
        <p class="intro-note">A clear view of your homes and monthly rental income.</p>
      </div>
      <span class="live-badge">● &nbsp; Portfolio summary</span>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
    <section id="dashboard" hidden aria-label="Rental portfolio">
      <div class="summary" aria-label="Portfolio totals">
        <article class="summary-card">
          <span class="summary-label">Total houses</span>
          <strong id="total-houses" class="summary-value"></strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Occupied</span>
          <strong id="occupied-houses" class="summary-value"></strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Vacant</span>
          <strong id="vacant-houses" class="summary-value"></strong>
        </article>
        <article class="summary-card rent">
          <span class="summary-label">Expected rent / month</span>
          <strong id="expected-rent" class="summary-value"></strong>
        </article>
      </div>

      <section aria-labelledby="numbered-title">
        <div class="section-heading">
          <h2 id="numbered-title">Houses 1–20</h2>
          <span id="numbered-count" class="section-count"></span>
        </div>
        <div id="numbered-houses" class="house-grid"></div>
      </section>
      <section aria-labelledby="a-series-title">
        <div class="section-heading">
          <h2 id="a-series-title">A-series · A1–A10</h2>
          <span id="a-series-count" class="section-count"></span>
        </div>
        <div id="a-series-houses" class="house-grid"></div>
      </section>
    </section>
  </main>

  <script type="module">
    import { getTotals, parseHouses } from './src/houseparser.js';

    const expectedHouseNumbers = [
      ...Array.from({ length: 20 }, (_, index) => String(index + 1)),
      ...Array.from({ length: 10 }, (_, index) => `A${index + 1}`)
    ];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = '';
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (quoted) {
          if (character === '"' && text[index + 1] === '"') {
            field += '"';
            index += 1;
          } else if (character === '"') {
            quoted = false;
          } else {
            field += character;
          }
        } else if (character === '"' && field.length === 0) {
          quoted = true;
        } else if (character === ',') {
          row.push(field);
          field = '';
        } else if (character === '\n' || character === '\r') {
          if (character === '\r' && text[index + 1] === '\n') index += 1;
          row.push(field);
          if (row.some(value => value.trim() !== '')) rows.push(row);
          row = [];
          field = '';
        } else {
          field += character;
        }
      }
      if (quoted) throw new Error('The houses CSV contains an unterminated quoted field.');
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        if (row.some(value => value.trim() !== '')) rows.push(row);
      }

      const [headers, ...records] = rows;
      if (!headers) throw new Error('The houses CSV is empty.');
      return records.map((values, rowIndex) => {
        if (values.length !== headers.length) {
          throw new Error(`Invalid CSV row ${rowIndex + 2}: expected ${headers.length} columns, found ${values.length}.`);
        }
        return Object.fromEntries(headers.map((header, index) => [header.trim(), values[index].trim()]));
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function renderHouse(house) {
      const occupied = house.Status.trim().toLowerCase() === 'occupied';
      const tenant = house.TenantName.trim();
      return `
        <article class="house-card">
          <div class="house-top">
            <span class="house-number">${escapeHtml(house.houseNo)}</span>
            <span class="status${occupied ? ' occupied' : ''}">${escapeHtml(house.Status)}</span>
          </div>
          <p class="tenant">${tenant ? `Tenant: ${escapeHtml(tenant)}` : 'No tenant assigned'}</p>
          <div class="house-rent">${house.monthlyRent.toLocaleString()}<span class="rent-caption">/ month</span></div>
        </article>`;
    }

    function renderDashboard(houses) {
      const byHouseNumber = new Map(houses.map(house => [house.houseNo.toUpperCase(), house]));
      const missing = expectedHouseNumbers.filter(number => !byHouseNumber.has(number.toUpperCase()));
      const unexpected = houses.filter(house => !expectedHouseNumbers.includes(house.houseNo.toUpperCase()));
      if (missing.length || unexpected.length || houses.length !== expectedHouseNumbers.length) {
        const details = [];
        if (missing.length) details.push(`missing: ${missing.join(', ')}`);
        if (unexpected.length) details.push(`unexpected: ${unexpected.map(house => house.houseNo).join(', ')}`);
        throw new Error(`Expected exactly houses 1–20 and A1–A10 (${expectedHouseNumbers.length} total); ${details.join('; ')}.`);
      }

      const totals = getTotals(houses);
      document.querySelector('#total-houses').textContent = totals.totalHouses;
      document.querySelector('#occupied-houses').textContent = totals.occupied;
      document.querySelector('#vacant-houses').textContent = totals.vacant;
      document.querySelector('#expected-rent').textContent = totals.expectedRent.toLocaleString();

      const numbered = houses.filter(house => !house.isASeries);
      const aSeries = houses.filter(house => house.isASeries);
      document.querySelector('#numbered-houses').innerHTML = numbered.map(renderHouse).join('');
      document.querySelector('#a-series-houses').innerHTML = aSeries.map(renderHouse).join('');
      document.querySelector('#numbered-count').textContent = `${numbered.length} properties`;
      document.querySelector('#a-series-count').textContent = `${aSeries.length} properties`;
      document.querySelector('#dashboard').hidden = false;
    }

    try {
      const response = await fetch('./templates/houses.csv');
      if (!response.ok) throw new Error(`Could not load houses.csv (HTTP ${response.status}).`);
      const houses = parseHouses(parseCsv(await response.text()));
      renderDashboard(houses);
    } catch (error) {
      document.querySelector('#error').textContent = `${error.message} Open this page through a local web server so it can load the CSV and parser files.`;
      document.querySelector('#error').hidden = false;
    }
  </script>
</body>
</html>
