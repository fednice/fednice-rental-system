<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a">
  <title>My rental | FEDNICE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#0a0a0a;color:#fff;font:15px Arial,sans-serif}.topbar{background:#111;border-bottom:1px solid #292929}.top-inner{width:min(900px,calc(100% - 32px));min-height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:130px;height:52px;object-fit:contain;object-position:left center}.button{padding:10px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font:inherit;font-weight:700;cursor:pointer}main{width:min(900px,calc(100% - 32px));margin:30px auto 50px;flex:1}.eyebrow{margin:0 0 8px;color:#ff9a53;text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:12px}h1{margin:0;font-size:clamp(25px,5vw,38px)}.intro{color:#aaa}.notice{margin:18px 0;padding:14px;border:1px solid #393939;border-radius:10px;background:#141414;color:#ddd}.notice.error{border-color:#a14635;color:#ffb3a5;background:#291512}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-height:125px;padding:20px;border:1px solid #292929;border-radius:13px;background:#141414}.card.wide{grid-column:1/-1}.label{display:block;color:#aaa;font-size:13px}.value{display:block;margin-top:10px;font-size:clamp(20px,4vw,28px);font-weight:800;overflow-wrap:anywhere}.due{border-color:#365b3d;background:#112016}.due.red{border-color:#873a32;background:#291512}.due.red .value{color:#ff9183}.bill-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #292929}.bill-line:last-child{border:0}.footer{padding:14px;text-align:center;border-top:1px solid #292929;background:#111;color:#aaa;font-size:12px;line-height:1.6}.footer a{color:#ff9a53;text-decoration:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.top-inner{min-height:64px}.logo{width:110px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner"><a href="index.html"><img class="logo" src="logo.png" alt="FEDNICE"></a><button id="logout" class="button" type="button">Sign out</button></div></header>
  <main><p class="eyebrow" id="property-name">Tenant portal</p><h1 id="welcome">Your rental details</h1><p class="intro">This page shows the tenancy linked to your login.</p><p id="notice" class="notice" role="status" aria-live="polite">Loading your rental details…</p><section id="details" class="grid" hidden><article class="card"><span class="label">Your house</span><strong id="house-number" class="value">—</strong></article><article id="due-card" class="card due"><span class="label">Next rent date</span><strong id="due-date" class="value">—</strong><span id="due-status" class="label"></span></article><article class="card"><span class="label">Monthly rent</span><strong id="rent" class="value">—</strong></article><article class="card"><span class="label">Current total due</span><strong id="total" class="value">—</strong></article><article class="card wide"><span class="label">Current billing details</span><div id="bill-lines" style="margin-top:10px"></div></article><article class="card wide"><span class="label">Landlord</span><strong id="landlord-name" class="value" style="font-size:20px">—</strong><a id="landlord-phone" class="label" style="display:inline-block;margin-top:9px;color:#ff9a53"></a></article></section></main>
  <footer class="footer">For any assistance call <a href="tel:0114462079">0114462079</a> or contact <a href="mailto:fednicesolutions@gmail.com">fednicesolutions@gmail.com</a></footer>
  <script src="./api-config.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script><script src="./firebase.js"></script>
  <script>
    (() => {
      const apiBase = String(window.FEDNICE_API_BASE || '').replace(/\/$/, '');
      const notice = document.getElementById('notice');
      const money = amount => `KSh ${Number(amount || 0).toLocaleString('en-KE')}`;
      const date = value => value ? new Intl.DateTimeFormat('en-KE',{day:'numeric',month:'long',year:'numeric'}).format(new Date(value)) : 'Not set';
      let refreshTimer = null;
      let checkingAccess = false;
      async function refreshTenantDetails(user) {
        if (checkingAccess) return;
        checkingAccess = true;
        try {
          const token = await user.getIdToken();
          const response = await fetch(`${apiBase}/api/tenants/me`, {headers:{Authorization:`Bearer ${token}`}});
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (response.status === 401 || response.status === 404) {
              document.getElementById('details').hidden = true;
              await firebase.auth().signOut();
              notice.textContent = 'This tenant login is no longer active. Contact your landlord if you need access.';
              notice.classList.add('error'); notice.hidden = false;
              setTimeout(() => window.location.replace('tenant-login.html'), 1800);
              return;
            }
            throw new Error(data.error || 'Could not check your tenant access.');
          }
          const rent = Number(data.monthlyRent || 0), water = Number(data.waterBill || 0), power = Number(data.powerBill || 0);
          const due = data.nextDueAt ? new Date(data.nextDueAt) : null;
          const days = due ? Math.ceil((new Date(due.getFullYear(),due.getMonth(),due.getDate()) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())) / 86400000) : null;
          document.getElementById('welcome').textContent = `Hello, ${data.fullName || 'tenant'}`;
          document.getElementById('property-name').textContent = data.propertyName || 'Tenant portal';
          document.getElementById('house-number').textContent = data.houseNumber || 'House details unavailable';
          document.getElementById('rent').textContent = money(rent);
          document.getElementById('total').textContent = money(rent + water + power);
          document.getElementById('due-date').textContent = date(data.nextDueAt);
          const dueCard = document.getElementById('due-card');
          document.getElementById('due-status').textContent = days == null ? '' : days < 0 ? `Overdue by ${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'}` : days === 0 ? 'Due today' : `Due in ${days} day${days === 1 ? '' : 's'}`;
          dueCard.classList.toggle('red', days != null && days <= 5);
          const bills = [['Rent',rent],['Water',data.waterBill],['Power',data.powerBill]].filter(([name,value]) => name === 'Rent' || value != null);
          document.getElementById('bill-lines').innerHTML = bills.map(([name,value]) => `<div class="bill-line"><span>${name}</span><strong>${money(value)}</strong></div>`).join('');
          document.getElementById('landlord-name').textContent = data.propertyName || 'Your landlord';
          const phoneLink = document.getElementById('landlord-phone');
          if (data.landlordPhone) { phoneLink.href = `tel:${data.landlordPhone}`; phoneLink.textContent = `Call landlord: ${data.landlordPhone}`; }
          document.getElementById('details').hidden = false; notice.hidden = true;
        } catch (error) {
          document.getElementById('details').hidden = true;
          notice.textContent = error.message || 'Could not verify your tenant access. Check your connection and try again.'; notice.classList.add('error'); notice.hidden = false;
        } finally { checkingAccess = false; }
      }
      document.getElementById('logout').addEventListener('click', async () => { await firebase.auth().signOut(); window.location.replace('tenant-login.html'); });
      firebase.auth().onAuthStateChanged(async user => {
        if (!user) { window.location.replace('tenant-login.html'); return; }
        if (!apiBase) { notice.textContent = 'Tenant account service is not configured. Contact FEDNICE for help.'; notice.classList.add('error'); return; }
        await refreshTenantDetails(user);
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => { if (firebase.auth().currentUser) refreshTenantDetails(firebase.auth().currentUser); }, 20000);
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden && firebase.auth().currentUser) refreshTenantDetails(firebase.auth().currentUser); });
    })();
  </script>
</body>
</html>
