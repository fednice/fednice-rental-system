<!DOCTYPE html><html><head><title>FEDNICE Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>body{background:#111; color:white; font-family:Arial; padding:20px;} button{background:#ff6b2b; border:none; color:white; padding:12px 18px; border-radius:10px; font-weight:bold; cursor:pointer;}.code{font-size:20px; background:#222; padding:14px; border-radius:10px; border:1px solid #ff6b2b; margin:12px 0;}.footer{margin-top:30px; color:#888; font-size:12px; text-align:center; border-top:1px solid #333; padding-top:10px;}</style>
</head><body>
<h2>🔑 FEDNICE Admin - Generate One-Time Codes</h2>
<p>Confirm M-Pesa 2500 on 0797477437, then generate code and send to customer.</p>
<button onclick="gen()">+ Generate New Code</button>
<div id="out"></div>
<h3>Last 20 Codes</h3><div id="list">Loading...</div>
<div class="footer">For any assistance call <b style="color:#ff6b2b;">0797477437</b> or contact <b style="color:#ff6b2b;">fednicesolutions@gmail.com</b></div>
<script>
function makeCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='FDN-'; for(let i=0;i<4;i++)c+=s[Math.floor(Math.random()*s.length)]; c+='-'; for(let i=0;i<4;i++)c+=s[Math.floor(Math.random()*s.length)]; return c;}
async function gen(){const code=makeCode(); await db.collection('codes').add({code, used:false, createdAt:new Date().toISOString()}); document.getElementById('out').innerHTML=`<div class=code>${code} <button onclick="navigator.clipboard.writeText('${code}')">Copy</button> <a href="https://wa.me/?text=Your%20FEDNICE%20code%20is%20${code}.%20Enter%20at%20fednice.github.io/fednice-rental-system/payment.html" target="_blank" style="color:#4ade80; margin-left:10px;">WhatsApp</a></div>`; load();}
async function load(){const snap=await db.collection('codes').orderBy('createdAt','desc').limit(20).get(); let h=''; snap.forEach(d=>{const x=d.data(); h+=`<div style="padding:8px; border-bottom:1px solid #333;">${x.code} — ${x.used?'🔴 USED by '+x.usedBy+' on '+x.usedAt:'🟢 UNUSED'}</div>`}); document.getElementById('list').innerHTML=h||'No codes yet';} load();
</script></body></html>
