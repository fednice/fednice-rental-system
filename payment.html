<!DOCTYPE html>
<html>
<head>
<title>FEDNICE - Secure Checkout</title>
<style>
body{margin:0; min-height:100vh; background:#0d0d0d; display:flex; justify-content:center; align-items:center; font-family:Arial; position:relative;}
.nav{position:absolute; top:0; left:0; right:0; padding:15px 25px; display:flex; justify-content:space-between; align-items:center; z-index:2; background:rgba(0,0,0,0.5); border-bottom:1px solid #222;}
.logo-area{display:flex; align-items:center; gap:10px;}
.logo-area img{height:42px; width:auto; object-fit:contain; border-radius:6px;}
.logo-text{color:white; font-weight:bold; font-size:18px; line-height:1.1;}
.logo-text span{color:#888; font-size:11px; display:block; letter-spacing:2px;}
.card{position:relative; z-index:2; width:90%; max-width:480px; background:#1e1e1e; border:1px solid rgba(255,107,43,0.3); border-radius:20px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,0.6); margin-top:70px;}
h2{color:white; margin:10px 0 5px; font-size:24px;} p.sub{color:#aaa; font-size:13px; margin-bottom:18px;}
.box{background:#2a1f1a; border:1px solid #ff6b2b; border-radius:12px; padding:14px; display:flex; justify-content:space-between; align-items:center;}
.masked{color:white; font-weight:bold; font-size:18px;}
.btn-show{background:#ff6b2b; border:none; color:white; padding:7px 16px; border-radius:20px; cursor:pointer; font-weight:bold;}
label{color:#ddd; font-size:13px; margin-top:14px; display:block;}
input{width:100%; padding:12px; margin-top:6px; background:#222; border:1px solid #444; border-radius:10px; color:white; box-sizing:border-box;}
.btn-pay{width:100%; margin-top:18px; background:#ff6b2b; color:white; border:none; padding:14px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer;}
.trust{display:flex; gap:15px; justify-content:center; margin-top:16px; font-size:11px; color:#ffb28a;}
</style>
</head>
<body>
<div class="nav">
<div class="logo-area">
<img src="logo.png" alt="FEDNICE Logo" onerror="this.style.display='none'">
<div class="logo-text">FEDNICE<span>REAL ESTATE</span></div>
</div>
<div style="border:1px solid #ff6b2b; padding:6px 14px; border-radius:20px; color:#ff9a6b; font-size:12px;">🔒 Secure Checkout</div>
</div>

<div class="card">
<h2>Pay KSH 2,500 to activate account</h2>
<p class="sub">Complete payment via M-Pesa to activate your landlord account and start listing properties</p>
<div class="box">
<div><div style="font-size:12px; color:#aaa;">M-Pesa Send Money details</div><div id="masked" class="masked">07** ***437</div><div id="full" class="masked" style="display:none; color:#4ade80;">0797477437</div></div>
<button class="btn-show" onclick="showNum()">Show</button>
</div>
<div style="display:flex; justify-content:space-between; color:#ccc; font-size:14px; margin-top:14px; border-top:1px dashed #444; padding-top:12px;"><span>Amount</span><span style="color:white; font-weight:bold;">KSH 2,500</span></div>
<label>M-Pesa Transaction Code</label><input id="code" placeholder="e.g. QWX7T9Z3PL">
<label>Your M-Pesa Phone Number</label><input id="phone" placeholder="+254 7•• ••• •••">
<button class="btn-pay" onclick="pay()">🔒 Pay KSH 2,500 Now</button>
<div class="trust"><span>🛡️ SSL Secured</span><span>💬 Receipt via SMS</span><span>🔒 Secure & Encrypted</span></div>
</div>

<script>
function showNum(){document.getElementById('masked').style.display='none'; document.getElementById('full').style.display='block';}
function pay(){ const c=document.getElementById('code').value.trim(); if(c.length<6){alert('Enter M-Pesa code'); return;} let u=JSON.parse(localStorage.getItem('fednice_user'))||{}; u.paymentCode=c; u.paymentStatus='pending'; localStorage.setItem('fednice_user', JSON.stringify(u)); window.location.href='dashboard.html';}
</script>
</body>
</html>
